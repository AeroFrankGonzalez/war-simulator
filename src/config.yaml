# config.yaml

# Configuración general de la simulación
simulation:
  grid_size: 50          # Tamaño de la cuadrícula del terreno (ej. 50x50 celdas)
  cell_size: 12          # Tamaño visual de cada celda en píxeles (para la visualización)
  simulation_speed: 0.1  # Retraso en segundos entre cada paso de simulación (afecta la velocidad percibida)

# Configuración del terreno
terrain:
  preset: "valley"    # Preset de mapa a usar al inicio.
  contact_radius: 1.0    # (Obsoleto en CA, pero mantenido por compatibilidad si se usa)

# Reglas del Autómata Celular (Game of Life - War Edition)
automaton_rules:
  survival_threshold: [2, 3] # Número de vecinos ALIADOS necesarios para sobrevivir (inclusive).
  birth_threshold: [3]       # Número de vecinos ALIADOS necesarios para nacer en una celda vacía.
  enemy_tolerance: 3         # Número MÁXIMO de vecinos ENEMIGOS permitidos antes de morir por superpoblación enemiga.

# Configuración de los equipos (Team 1 y Team 2)
teams:
  1: # Configuración para el Equipo 1 (ej. Rojo)
    initial_pop_percent: 0.2 # Porcentaje del área inicial ocupada por unidades (densidad inicial)
    health: 1          # (Simplificado para CA: 1 = Vivo, 0 = Muerto)
    
  2: # Configuración para el Equipo 2 (ej. Azul)
    initial_pop_percent: 0.2
    health: 1

# Configuración de la visualización
visualization:
  colors:
    # Colores base para los equipos
    team1: [255, 0, 0]    # Rojo
    team2: [0, 0, 255]    # Azul

# Condiciones de victoria
victory:
  conquest_percentage: 70.0 # Porcentaje de terreno controlado para ganar via conquista.